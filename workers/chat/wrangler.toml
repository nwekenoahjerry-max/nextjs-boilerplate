name = "clerkme-chat"
main = "index.ts"
compatibility_date = "2026-11-04"
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "clerkme"
database_id = "ccfafcf6-4ce7-43de-b406-fc2b1130f683"

[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ConversationRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationRoom"]

[env.preview]
name = "clerkme-chat-preview"
workers_dev = false

[[env.preview.d1_databases]]
binding = "DB"
database_name = "clerkme-preview"
database_id = "9d6dcdd2-6c8c-43fa-a776-08f16ae286ac"

[[env.preview.durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ConversationRoom"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationRoom"]
